<!DOCTYPE html>
<html>
<head>
  <title>Translator the for letter cult</title>
  <link rel='stylesheet' href='./style.css'>
  <link rel='stylesheet' href='/assets/fonts/fonts.css'>
</head>
<body>
  <h1>[text translator]</h1>
  <center>
    <div class='textarea'>
      <textarea id='textin' rows='16' cols='140' placeholder='Initial text goes here...' autocomplete='off' spellcheck='false'></textarea>
      <div class='scanlines'></div>
    </div>
    <button id='fetchlist'>Fetch list</button>

    <br><div id='rarr'>&rarr;</div>

    <div class='textarea'>
      <textarea id='textout' rows="16" cols="140" placeholder='Translated text comes out here...' spellcheck='false' readonly></textarea>
      <div class='scanlines'></div>
    </div>
    <button id='copy'>Copy</button>
  </center>
</body>
<script src='./script.js'></script>
</html>
